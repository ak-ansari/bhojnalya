# Local development stack (TRD §15.1–15.2): postgres, the migrate step, the
# api and caddy.
#
#   pnpm db:up                                   # postgres only, waits for healthy
#   docker compose -f infra/docker-compose.yml up -d --build --wait
#   pnpm db:down                                 # stop; add -v to wipe the volume
#
# Variables come from infra/.env (copy infra/.env.example). Compose reads it
# automatically because it sits beside this file.

name: bhojnalya

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: postgres
      # Read by postgres/init/01-roles.sh on the first start of an empty volume.
      DB_NAME: ${DB_NAME:-bhojnalya}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in infra/.env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD in infra/.env}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set PLATFORM_ADMIN_PASSWORD in infra/.env}
      TZ: UTC
    # TRD §15.2 tuning for a 2 GB VPS; the API pool is 10 of these 50.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=50
      - -c
      - timezone=UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      # Healthy only once the app database exists and app_user can log in,
      # so `up --wait` returns after the init script has finished.
      test:
        - CMD-SHELL
        - PGPASSWORD="$$APP_USER_PASSWORD" psql -h 127.0.0.1 -U app_user -d "$$DB_NAME" -tAc 'select 1'
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CADDY_HTTP_PORT:-8080}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # The migrate step (TRD §15.2): SQL migrations, then pg-boss's tables, as the
  # owner. Runs to completion before the API starts; only it gets the owner URL.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: bhojnalya-api:local
    command: [node, dist/migrate.js]
    environment:
      TZ: UTC
      MIGRATION_DATABASE_URL: postgres://bhojnalya_owner:${DB_OWNER_PASSWORD}@postgres:5432/${DB_NAME:-bhojnalya}
    depends_on:
      postgres:
        condition: service_healthy

  # REST, Socket.io and pg-boss in one process, as app_user (ADR 0011, 0020).
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: bhojnalya-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: 3000
      LOG_LEVEL: ${API_LOG_LEVEL:-info}
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@postgres:5432/${DB_NAME:-bhojnalya}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  caddy_data:
  caddy_config:
